<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FLUX C17 Loading</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #050505;
        }

        /* Фоновая картинка с анимацией */
        .bg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('background.jpg') center/cover no-repeat; 
            animation: breathe 10s infinite ease-in-out alternate;
        }

        @keyframes breathe {
            0% { transform: scale(1); filter: contrast(1) brightness(1); }
            100% { transform: scale(1.05); filter: contrast(1.1) brightness(0.95); }
        }

        /* Эффект пролетающего дрона */
        .drone-light {
            position: absolute; top: 15%; left: -10%; width: 200px; height: 2px;
            background: linear-gradient(90deg, transparent, #ffffcc, transparent);
            box-shadow: 0 0 20px #ffffaa;
            z-index: 2; opacity: 0.6;
            animation: flyDrone 15s infinite linear;
        }
        
        .beam {
            position: absolute; top: 15%; left: -10%; 
            width: 0; height: 0;
            border-left: 10px solid transparent; 
            border-right: 10px solid transparent;
            border-top: 150px solid rgba(255, 255, 200, 0.1);
            filter: blur(5px);
            animation: flyBeam 15s infinite linear;
            z-index: 1;
        }

        @keyframes flyDrone {
            0% { transform: translateX(-10vw); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateX(120vw); opacity: 0; }
        }
        @keyframes flyBeam {
            0% { transform: translateX(-10vw); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateX(120vw); opacity: 0; }
        }

        /* Индикатор загрузки (три красные точки) */
        .loading-dots {
            position: absolute; bottom: 60px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 10px; z-index: 3;
        }
        .dot {
            width: 8px; height: 8px; background: #ff3333;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px red; }
        }
    </style>
</head>
<body>

    <audio id="myAudio" loop>
        <source src="soundtrack.mp3" type="audio/mpeg">
    </audio>

    <div class="bg-layer"></div>
    <div class="drone-light"></div>
    <div class="beam"></div>

    <!-- Только индикатор загрузки внизу -->
    <div class="loading-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <script>
        window.addEventListener('load', function() {
            var audio = document.getElementById("myAudio");
            audio.play().catch(function(error) {
                document.body.addEventListener('click', function() {
                    audio.volume = 0.5;
                    audio.play();
                }, { once: true });
            });
        });
    </script>
</body>
</html>
