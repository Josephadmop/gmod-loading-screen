<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FLUX C17</title>
    <style>
        /* Сброс всех отступов */
        body, html {
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%;
            overflow: hidden; 
            background-color: #000;
            cursor: default; /* Курсор обычный */
        }

        /* Контейнер для картинки */
        .screen-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        /* Сама картинка */
        img.main-bg {
            /* Ключевой момент для качества: запрещаем браузеру размазывать картинку при масштабировании */
            image-rendering: -webkit-optimize-contrast; 
            
            /* Растягиваем на весь экран, сохраняя пропорции */
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            
            /* Легкая настройка яркости/контраста, если нужно сделать четче */
            filter: contrast(1.05) brightness(1.0);
        }

        /* Затемнение по краям (виньетка), чтобы фокус был в центре */
        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.6) 100%);
            pointer-events: none; /* Чтобы виньетка не мешала кликам */
            z-index: 2;
        }

        /* Текст подсказки про звук (появляется только если звук выключен) */
        .audio-hint {
            position: absolute;
            bottom: 80px; /* Выше стандартной полоски GMod */
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 3;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        
        .audio-hint.hidden {
            opacity: 0;
        }

    </style>
</head>
<body>

    <!-- Звуковой элемент -->
    <!-- preload="auto" говорит браузеру качать звук сразу -->
    <audio id="bg-music" loop preload="auto">
        <source src="soundtrack.mp3" type="audio/mpeg">
    </audio>

    <div class="screen-container">
        <!-- ВАЖНО: Имя файла должно совпадать точно -->
        <img src="background.jpg" alt="Flux C17 Loading Screen" class="main-bg">
    </div>
    
    <div class="vignette"></div>

    <!-- Подсказка "Нажмите любую кнопку для звука" -->
    <div class="audio-hint" id="hint-text">
        Нажмите ЛКМ или пробел для включения звука
    </div>

    <script>
        const audio = document.getElementById('bg-music');
        const hint = document.getElementById('hint-text');
        let isPlaying = false;

        // Функция запуска звука
        function startAudio() {
            if (!isPlaying) {
                audio.volume = 0.6; // Громкость 60%
                
                // Пытаемся запустить
                const playPromise = audio.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        // Если запустилось успешно
                        isPlaying = true;
                        hint.classList.add('hidden'); // Прячем подсказку
                        
                        // Удаляем слушатели событий, они больше не нужны
                        window.removeEventListener('click', startAudio);
                        window.removeEventListener('keydown', startAudio);
                    }).catch(error => {
                        console.log("Звук заблокирован:", error);
                        // Если ошибка, оставляем подсказку видимой
                    });
                } else {
                    // Старые браузеры могут вернуть undefined
                    isPlaying = true;
                    hint.classList.add('hidden');
                }
            }
        }

        // Слушаем клик мышью где угодно на экране
        window.addEventListener('click', startAudio);
        
        // Слушаем нажатие любой клавиши (пробел, Enter и т.д.)
        window.addEventListener('keydown', startAudio);

        // Дополнительная страховка: попытка автозапуска через 1 секунду после загрузки
        // Иногда GMod позволяет автозапуск, если страница уже активна
        setTimeout(() => {
            if(!isPlaying) {
                 // Пробуем тихо запустить, иногда это обходит блокировку в специфических движках
                 audio.muted = true; 
                 audio.play().then(() => {
                     audio.muted = false; // Размучиваем
                     isPlaying = true;
                     hint.classList.add('hidden');
                 }).catch(e => {});
            }
        }, 1000);

    </script>
</body>
</html>
