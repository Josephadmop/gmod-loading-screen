<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FLUX C17</title>
    <style>
        body, html {
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%;
            overflow: hidden; 
            background-color: #000;
            /* Отключаем выделение текста и курсоры, если нужно */
            user-select: none; 
        }

        .screen-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        img.main-bg {
            /* МАКСИМАЛЬНОЕ КАЧЕСТВО КАРТИНКИ */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            
            /* Легкая коррекция резкости через фильтр, если браузер все равно мылит */
            filter: contrast(1.1) saturate(1.1);
        }

        /* Виньетка для атмосферы */
        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.7) 100%);
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>
<body>

    <!-- Звук без атрибутов controls, скрытый -->
    <audio id="bg-music" loop preload="auto">
        <source src="soundtrack.mp3" type="audio/mpeg">
    </audio>

    <div class="screen-container">
        <img src="background.jpg" alt="Flux C17 Loading Screen" class="main-bg">
    </div>
    
    <div class="vignette"></div>

    <script>
        const audio = document.getElementById('bg-music');
        let started = false;

        // Функция запуска звука
        function tryPlayAudio() {
            if (started) return;
            
            audio.volume = 0.6; // Громкость
            
            // Пытаемся запустить
            const playPromise = audio.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    started = true;
                    // Если запустилось успешно, удаляем слушатели событий, чтобы экономить ресурсы
                    cleanupListeners();
                }).catch(error => {
                    // Если ошибка блокировки, ничего не делаем, ждем следующего действия пользователя
                    console.log("Waiting for interaction...");
                });
            } else {
                // Старые движки могут вернуть undefined
                started = true;
                cleanupListeners();
            }
        }

        // Удаляем слушателей после успешного старта
        function cleanupListeners() {
            window.removeEventListener('click', tryPlayAudio);
            window.removeEventListener('mousemove', tryPlayAudio);
            window.removeEventListener('keydown', tryPlayAudio);
        }

        // 1. Слушаем клик мышью
        window.addEventListener('click', tryPlayAudio);
        
        // 2. Слушаем движение мыши (часто игрок двигает мышкой сразу при появлении экрана)
        window.addEventListener('mousemove', tryPlayAudio);
        
        // 3. Слушаем клавиатуру
        window.addEventListener('keydown', tryPlayAudio);

        // 4. Попытка форсированного автозапуска через 500мс
        // В GMod иногда это срабатывает, так как контекст страницы считается "активным"
        setTimeout(() => {
            if(!started) {
                audio.muted = true;
                audio.play().then(() => {
                    audio.muted = false;
                    started = true;
                    cleanupListeners();
                }).catch(e => {});
            }
        }, 500);

    </script>
</body>
</html>
